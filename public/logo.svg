<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Glat opadgående kurve med lokalt min og max -->
  <path
    d="M20 150 
       C50 140, 60 120, 80 130  <!-- første lokalt min -->
       S120 90, 140 100         <!-- lokalt max -->
       S170 60, 180 50"         <!-- endelig stigning -->
    fill="none"
    stroke="#3B82F6"
    stroke-width="16"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Runde punkter -->
  <circle cx="20" cy="150" r="10" fill="#3B82F6"/>   <!-- start -->
  <circle cx="80" cy="130" r="10" fill="#3B82F6"/>   <!-- lokalt min -->
  <circle cx="140" cy="100" r="10" fill="#3B82F6"/>  <!-- lokalt max -->
  <circle cx="180" cy="50" r="10" fill="#3B82F6"/>   <!-- slut -->
</svg>
